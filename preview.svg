<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Name gradient (emerald → cyan → purple) -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Circle ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- ===== TOP BAR ===== -->
  <!-- Logo circle -->
  <circle cx="72" cy="58" r="22" fill="url(#logoGrad)"/>
  <text x="72" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0a1628">A</text>

  <!-- Brand name -->
  <text x="106" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">A'laa</text>
  <text x="162" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#10b981">.ai</text>
  <text x="106" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#64748b" letter-spacing="1.5">PORTFOLIO · 2026</text>

  <!-- Available for Hire badge -->
  <rect x="960" y="38" width="180" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="984" cy="56" r="5" fill="#34d399"/>
  <circle cx="984" cy="56" r="8" fill="#34d399" fill-opacity="0.3"/>
  <text x="1000" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#34d399" letter-spacing="0.5">AVAILABLE FOR HIRE</text>

  <!-- ===== MAIN CONTENT (left) ===== -->
  <text x="72" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Hi, I'm</text>

  <!-- Name with gradient -->
  <text x="72" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#nameGrad)">A'laa Abdelsattar</text>

  <!-- Role -->
  <text x="72" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">AI / Machine Learning Engineer</text>

  <!-- Sub info -->
  <text x="72" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500" fill="#64748b">CS Engineering · HTI · 2+ years experience</text>

  <!-- Tech tags -->
  <!-- Tag: Python -->
  <rect x="72" y="410" width="78" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="111" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#94a3b8">Python</text>

  <!-- Tag: TensorFlow -->
  <rect x="160" y="410" width="108" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="214" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#94a3b8">TensorFlow</text>

  <!-- Tag: PyTorch -->
  <rect x="278" y="410" width="88" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="322" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#94a3b8">PyTorch</text>

  <!-- Tag: YOLOv8 -->
  <rect x="376" y="410" width="82" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="417" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#94a3b8">YOLOv8</text>

  <!-- Tag: FastAPI -->
  <rect x="468" y="410" width="82" height="32" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="509" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#94a3b8">FastAPI</text>

  <!-- Tag: MLOps (highlighted) -->
  <rect x="560" y="410" width="78" height="32" rx="10" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="599" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#c084fc">MLOps</text>

  <!-- Bottom stats -->
  <text x="72" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#10b981">7+ ML Projects</text>
  <circle cx="195" cy="505" r="2.5" fill="#475569"/>
  <text x="210" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#22d3ee">95% Accuracy</text>
  <circle cx="330" cy="505" r="2.5" fill="#475569"/>
  <text x="345" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#a855f7">Production MLOps</text>

  <!-- ===== RIGHT SIDE: Logo circle ===== -->
  <!-- Outer glow ring -->
  <circle cx="980" cy="340" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.35"/>
  <circle cx="980" cy="340" r="115" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Main circle -->
  <circle cx="980" cy="340" r="95" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="3" filter="url(#softShadow)"/>
  <circle cx="980" cy="340" r="88" fill="url(#logoGrad)" opacity="0.15"/>

  <!-- Big letter A -->
  <text x="980" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#nameGrad)">A</text>

  <!-- 2+ YRS EXP badge -->
  <rect x="900" y="250" width="100" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="916" cy="264" r="4" fill="#34d399"/>
  <text x="928" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#e2e8f0">2+ YRS EXP</text>

  <!-- Small label under circle -->
  <text x="980" y="470" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">ML · CV · NLP</text>

  <!-- Bottom right domain -->
  <text x="1120" y="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#475569">alaaabdelsatar2004.github.io</text>
</svg>
